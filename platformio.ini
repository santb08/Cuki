; PlatformIO Project Configuration File
;
; Proyecto: tono de prueba I2S -> GY-PCM5102 -> PAM8403 -> parlante
; Placa   : ESP32 DevKit (WROOM-32, 30 pines, USB-serial CP2102)
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.12.0   ; -> Arduino-ESP32 core 2.0.17 / ESP-IDF 4.4.x
board = esp32dev
framework = arduino

; Velocidad del monitor serie (debe coincidir con Serial.begin del sketch)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Subida: si tu USB-UART no aguanta 921600, baja a 460800 o 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3        ; logs de ESP-IDF (0 = ninguno, 5 = verbose)

; Sin lib_deps: el sketch solo usa el driver I2S que ya viene en el framework.
